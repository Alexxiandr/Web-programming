<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>Лабораторна робота №7 - Завдання 2</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 750px;
            width: 100%;
            background-color: #ffffff;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #1b4332;
            text-align: center;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #dcdcdc;
            padding: 12px 14px;
            text-align: center;
            font-size: 14px;
        }

        th {
            background-color: #1b4332;
            color: #ffffff;
        }

        tr:nth-child(even) {
            background-color: #f9fbf9;
        }

        .code-cell {
            font-family: Consolas, monospace;
            font-weight: 600;
            color: #0b5394;
            text-align: left;
        }

        .status-ok {
            color: #27ae60;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Лабораторна робота №7 – Завдання 2</h2>

        <table>
            <thead>
                <tr>
                    <th>Виклик функції</th>
                    <th>Вхідне число (n)</th>
                    <th>Отриманий результат (n!)</th>
                </tr>
            </thead>
            <tbody id="results-body">
            </tbody>
        </table>
    </div>

    <script>
        function factorialRecursion(n) {
            if (n < 0) {
                return "Помилка (n < 0)";
            }
            if (n === 0 || n === 1) {
                return 1;
            }
            return n * factorialRecursion(n - 1);
        }
        
        const testNumbers = [0, 1, 5, 6, 7];
        const tbody = document.getElementById("results-body");

        testNumbers.forEach(num => {
            const result = factorialRecursion(num);

            const row = `<tr>
                <td class="code-cell">factorialRecursion(${num})</td>
                <td>${num}</td>
                <td class="status-ok">${result}</td>
            </tr>`;
            tbody.innerHTML += row;
        });
    </script>

</body>
</html>
