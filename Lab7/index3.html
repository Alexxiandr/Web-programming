<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>Лабораторна робота №7 - Завдання 3</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 780px;
            width: 100%;
            background-color: #ffffff;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #1b4332;
            text-align: center;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #dcdcdc;
            padding: 12px 14px;
            text-align: center;
            font-size: 14px;
        }

        th {
            background-color: #1b4332;
            color: #ffffff;
        }

        tr:nth-child(even) {
            background-color: #f9fbf9;
        }

        .code-cell {
            font-family: Consolas, monospace;
            font-weight: 600;
            color: #0b5394;
        }

        .calls-high {
            color: #c0392b;
            font-weight: bold;
        }

        .calls-low {
            color: #27ae60;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Лабораторна робота №7 – Завдання 3</h2>

        <table>
            <thead>
                <tr>
                    <th>Номер у ряду (n)</th>
                    <th>Значення Фібоначчі</th>
                    <th>Викликів (Рекурсія)</th>
                    <th>Викликів (Мемоїзація)</th>
                </tr>
            </thead>
            <tbody id="results-body">
            </tbody>
        </table>
    </div>

    <script>
        let numberOfRecursionCalls = 0;
        let numberOfMemoCalls = 0;

        function fibonachiRecursion(numberInRow) {
            numberOfRecursionCalls++;

            if (numberInRow <= 1) {
                return 1;
            }

            return fibonachiRecursion(numberInRow - 1) + fibonachiRecursion(numberInRow - 2);
        }

        function createFibonachiMemo() {
            const cache = {};

            return function fibonachiMemo(numberInRow) {
                numberOfMemoCalls++;

                if (numberInRow in cache) {
                    return cache[numberInRow];
                }

                if (numberInRow <= 1) {
                    return 1;
                }

                cache[numberInRow] = fibonachiMemo(numberInRow - 1) + fibonachiMemo(numberInRow - 2);
                return cache[numberInRow];
            };
        }

        // Перевірка з методички у консолі для n = 5
        const fibonachiMemo = createFibonachiMemo();
        console.log("Рекурсія (n=5):", fibonachiRecursion(5), "Викликів:", numberOfRecursionCalls);
        console.log("Мемоїзація (n=5):", fibonachiMemo(5), "Викликів:", numberOfMemoCalls);

        // Виведення порівняльної таблиці на сторінку
        const testValues = [5, 8, 10, 15];
        const tbody = document.getElementById("results-body");

        testValues.forEach(n => {
            numberOfRecursionCalls = 0;
            const recResult = fibonachiRecursion(n);
            const recCalls = numberOfRecursionCalls;

            numberOfMemoCalls = 0;
            const memoFn = createFibonachiMemo();
            const memoResult = memoFn(n);
            const memoCalls = numberOfMemoCalls;

            const row = `<tr>
                <td class="code-cell">n = ${n}</td>
                <td><b>${memoResult}</b></td>
                <td class="calls-high">${recCalls}</td>
                <td class="calls-low">${memoCalls}</td>
            </tr>`;
            tbody.innerHTML += row;
        });
    </script>

</body>
</html>
